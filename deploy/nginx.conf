# Единая точка входа: / — интерфейс (Vue), /api/<сервис>/ — сервисы.
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/users/      { proxy_pass http://users:8000/;      include /etc/nginx/conf.d/proxy.inc; }
    location /api/data-model/ { proxy_pass http://data_model:8000/; include /etc/nginx/conf.d/proxy.inc; }
    location /api/data-admin/ { proxy_pass http://data_admin:8000/; include /etc/nginx/conf.d/proxy.inc; }
    location /api/algo-model/ { proxy_pass http://algo_model:8000/; include /etc/nginx/conf.d/proxy.inc; }
    location /api/algo-admin/ { proxy_pass http://algo_admin:8000/; include /etc/nginx/conf.d/proxy.inc; }
    location /api/dashboards/ { proxy_pass http://dashboards:8000/; include /etc/nginx/conf.d/proxy.inc; }
    location /api/help/       { proxy_pass http://help:8000/;       include /etc/nginx/conf.d/proxy.inc; }

    # служебные вызовы между сервисами снаружи недоступны
    location ~ ^/api/[a-z-]+/internal/ { return 404; }

    location /assets/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
    # кабинеты — отдельные приложения (docs/decisions.md, № 52): адреса внутри кабинета → его index.html;
    # остальное (/, /login, старые адреса — перенаправляются приложением) → корневой index.html.
    # index.html не кэшируется, чтобы после обновления сразу подхватывалась новая сборка.
    location ~ ^/(monitoring|input|calc|design|admin)(/.*)?$ {
        add_header Cache-Control "no-cache";
        try_files $uri /$1/index.html;
    }
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
