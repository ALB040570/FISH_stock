[project]
name = "fishcommon"
version = "1.0.0"
description = "Общая библиотека сервисов FishStock"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "filelock>=3.13",
  "python-ulid>=2.2",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fishcommon"]
